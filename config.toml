# ─────────────────────────────────────────────────────────────────────────────
# A/B-тест обложки карточки Ozon по рекламному CTR
# ─────────────────────────────────────────────────────────────────────────────

[test]
# Название теста (для отчётов)
name = "cover-ctr-2026"

# Товар, у которого крутим обложку.
# product_id обязателен (число из кабинета/из ozon_seller.py resolve),
# offer_id — для читаемости отчётов.
product_id = 0
offer_id = ""

# ID рекламных кампаний, из которых берём показы/клики.
# Это должны быть кампании «Продвижение в поиске» / трафареты, где видна обложка.
# Узнать список: python ozon_performance.py campaigns
campaign_ids = []

# Старт теста. Формат: YYYY-MM-DDTHH:MM, время московское (UTC+3).
# Ставь ближайшую полночь, ротация выравнивается по началу суток МСК.
start = "2026-09-08T00:00"

# Длина одного блока показа варианта, в сутках.
block_days = 3

# Сколько раз прогнать весь набор вариантов (циклов ротации).
# Итоговая длительность = block_days * cycles * (кол-во вариантов).
# 3 * 2 * 5 = 30 дней.
cycles = 2

# Сколько часов в начале блока НЕ учитывать в статистике
# (переходный период: модерация/выкладка фото + догон CDN + прогрев).
# 24 = отбрасываем первые календарные сутки блока.
settle_hours = 24

# Перемешивать порядок вариантов в каждом цикле (сид фиксирован — воспроизводимо).
# Снижает влияние тренда по времени.
shuffle_each_cycle = true

# Минимум показов на вариант, ниже которого вывод считается ненадёжным.
min_impressions_per_variant = 1000

# По окончании теста автоматически поставить обложку-победителя.
# false = только отчёт, обложку ставишь сам.
apply_winner_on_finish = false

# ─────────────────────────────────────────────────────────────────────────────
# Варианты обложки. Первый в списке (index 0) — то, что стоит сейчас / базовый.
# URL должны быть публично доступны (Ozon скачивает их сам).
# Все 5 нужно один раз залить в карточку и дождаться модерации: python init.py
# ─────────────────────────────────────────────────────────────────────────────
[[variants]]
name = "A (текущая)"
url = "https://example.com/cover_a.jpg"

[[variants]]
name = "B"
url = "https://example.com/cover_b.jpg"

[[variants]]
name = "C"
url = "https://example.com/cover_c.jpg"

[[variants]]
name = "D"
url = "https://example.com/cover_d.jpg"

[[variants]]
name = "E"
url = "https://example.com/cover_e.jpg"
