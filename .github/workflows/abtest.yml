name: ozon-cover-abtest

on:
  schedule:
    - cron: "7 * * * *"      # каждый час: ротация обложки + сбор статистики
  workflow_dispatch:          # ручной запуск из вкладки Actions
    inputs:
      dry_run:
        description: "Только показать, ничего не менять"
        type: boolean
        default: false

concurrency:
  group: ozon-cover-abtest
  cancel-in-progress: false

permissions:
  contents: write             # чтобы коммитить data/*.csv, state.json, report.md

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rotate cover
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python rotate.py ${{ (inputs.dry_run && '--dry-run') || '' }}

      - name: Collect stats
        if: ${{ !inputs.dry_run }}
        env:
          OZON_PERF_CLIENT_ID: ${{ secrets.OZON_PERF_CLIENT_ID }}
          OZON_PERF_CLIENT_SECRET: ${{ secrets.OZON_PERF_CLIENT_SECRET }}
        run: python collect.py || echo "collect failed (нет данных за сутки?) — продолжаем"

      - name: Analyze
        if: ${{ !inputs.dry_run }}
        run: python analyze.py || echo "analyze skipped (мало данных)"

      - name: Commit results
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "abtest-bot"
          git config user.email "actions@github.com"
          git add -A data report.md || true
          git diff --cached --quiet || git commit -m "abtest: $(date -u +%FT%TZ)"
          git push || true
